name: Validate shared theme
on:
  push:
    branches: [main, feature/expressive-components]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Compile library
        run: gradle :theme:assembleDebug :theme:assembleRelease :theme:publishReleasePublicationToMavenLocal -PthemeVersion=0.1.0-ci --stacktrace
      - name: Verify staged Maven package
        run: |
          test -s "$HOME/.m2/repository/dev/n2k02/theme/0.1.0-ci/theme-0.1.0-ci.aar"
          test -s "$HOME/.m2/repository/dev/n2k02/theme/0.1.0-ci/theme-0.1.0-ci.pom"
          test -s "$HOME/.m2/repository/dev/n2k02/theme/0.1.0-ci/theme-0.1.0-ci.module"
